<!DOCTYPE html>
<!-- Source for the Chrome Web Store "small promo tile" (440x280).
     Rendered to store/promo-small.png by scripts/make-store-assets.mjs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 440px; height: 280px; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 60%, #1e40af 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 34px 36px;
        position: relative;
        overflow: hidden;
      }
      .badge {
        width: 60px; height: 60px;
        background: rgba(255,255,255,0.14);
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px;
        margin-bottom: 18px;
      }
      h1 { font-size: 34px; letter-spacing: -0.5px; }
      p { font-size: 15px; opacity: 0.9; margin-top: 8px; max-width: 300px; line-height: 1.5; }
      .chips { display: flex; gap: 8px; margin-top: 18px; }
      .chip {
        font-size: 12px; font-weight: 600;
        background: rgba(255,255,255,0.16);
        padding: 4px 11px; border-radius: 999px;
      }
      .glow {
        position: absolute; right: -60px; top: -60px;
        width: 240px; height: 240px; border-radius: 50%;
        background: rgba(255,255,255,0.10);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="badge">🗂️</div>
    <h1>Quick Capture</h1>
    <p>Save any page as a tagged card — notes, screenshots, collections. All local.</p>
    <div class="chips">
      <span class="chip">Tags</span>
      <span class="chip">Screenshots</span>
      <span class="chip">Collections</span>
    </div>
  </body>
</html>
